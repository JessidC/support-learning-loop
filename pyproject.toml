[project]
name = "support-learning-loop"
version = "0.1.0"
description = "A support bot that learns from the agents who take over its escalations, with an expert approving every new answer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "fastembed>=0.4",
    "numpy>=1.26",
]

[project.scripts]
loop = "learnloop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnloop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
